name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tên tag để tạo Release (ví dụ v1.3.0). Để trống = chỉ build, lấy zip ở Artifacts'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: macos-arm64
            runner: macos-latest        # chip M
          - target: macos-x64
            runner: macos-15-intel      # runner Intel; kiểm tra lại trang "GitHub-hosted runners" trước mỗi lần phát hành
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # cùng phiên bản Node dùng làm vỏ file chạy
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: FPSWeb-${{ matrix.target }}
          path: release/FPSWeb-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Lấy ghi chú từ CHANGELOG.md
        run: node scripts/release-notes.mjs "$TAG" > notes.md
      - name: Tạo Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # Tag chưa có thì gh tự tạo trên commit đang build (--target)
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "FPS Web $TAG" --notes-file notes.md $flags
